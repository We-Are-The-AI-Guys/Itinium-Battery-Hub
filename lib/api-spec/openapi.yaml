openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /jobs:
    get:
      operationId: getReportingJobs
      summary: Scoped job list with separate net reporting weight; tonnage remains gross
      responses:
        "200":
          description: Existing job fields plus read-only net reporting values
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        id: { type: integer }
                        tonnage: { type: string, description: Gross loading tonnes; unchanged }
                        reportingNetTonnage:
                          type: [string, "null"]
                          description: Estimated net tonnes until every receipt row is reviewed, then accepted receipt Pb tonnes. Unknown weights are null.
                        reportingWeightConfirmed:
                          type: boolean
                          description: True only when all battery receipt rows have been reviewed.
  /jobs/{id}/documents/{docType}/history:
    get:
      operationId: getDocumentHistory
      summary: Admin or assigned collector document version history
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: docType, in: path, required: true, schema: { type: string, enum: [collection_sheet, consignment_note, statement] } }
      responses:
        "200":
          description: Version metadata without storage paths; never customer-facing
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      type: object
                      required: [versionId, version, fileName, uploadedById, uploadedAt]
                      properties:
                        versionId: { type: string }
                        version: { type: integer }
                        fileName: { type: string }
                        uploadedById: { type: [integer, "null"] }
                        uploadedAt: { type: string }
                        replacedById: { type: [integer, "null"] }
                        replacedAt: { type: [string, "null"] }
        "404": { description: History not found or inaccessible }
  /jobs/{id}/documents/{docType}/history/{versionId}/{action}:
    get:
      operationId: getDocumentVersionFile
      summary: Retrieve a preserved version with current assignment checks
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: docType, in: path, required: true, schema: { type: string, enum: [collection_sheet, consignment_note, statement] } }
        - { name: versionId, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [view, download] } }
      responses:
        "200":
          description: Private document stream
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: File absent or inaccessible }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

